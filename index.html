<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="कथा यात्रा">
<title>कथा यात्रा</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: one phone-width column. Two tabs (Today, Journey) and a full-screen reader. */
:root{
  --bg:#fdfcff; --soft:#f4f3f9; --ink:#24213a; --muted:#6a6782; --line:#e4e1ef;
  --accent:#0f6e6a; --accent-soft:#e0f1ef; --gold:#b9770e; --gold-soft:#fbefd9;
  --display:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --read:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a2b; --soft:#121120; --ink:#ebe9f6; --muted:#a5a2bd; --line:#2e2b44;
  --accent:#5fc9bf; --accent-soft:#163331; --gold:#e6b45a; --gold-soft:#33280f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a2b; --soft:#121120; --ink:#ebe9f6; --muted:#a5a2bd; --line:#2e2b44;
  --accent:#5fc9bf; --accent-soft:#163331; --gold:#e6b45a; --gold-soft:#33280f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;padding:22px 20px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:20px;color:var(--accent)}
.date{font-size:13px;color:var(--muted)}
.hello{font-family:var(--display);font-size:28px;margin:18px 0 2px;line-height:1.25}
.sub{color:var(--muted);margin:0}
.prog{margin:18px 0 6px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.today{margin-top:22px;background:var(--accent-soft);border-radius:18px;padding:22px 20px;display:grid;gap:10px}
.sym{width:64px;height:64px;color:var(--accent)}
.sym svg,.s svg{width:100%;height:100%;display:block}
.lbl{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.ttl{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.3;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.chip{background:var(--bg);border-radius:6px;padding:1px 8px}
.go{border:none;background:var(--accent);color:var(--bg);border-radius:12px;padding:12px;font-size:17px;font-weight:500;margin-top:4px}
.go.done{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.sect{margin-top:22px}
.sect h3{font-size:15px;font-weight:600;margin:0 0 8px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);text-align:left}
.row .n{font-size:12px;color:var(--muted);width:50px;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.row .t{font-family:var(--display);font-size:17px;flex:1;min-width:0}
.row .s{width:28px;height:28px;color:var(--gold);flex:0 0 auto}
.lock{opacity:.75}
.lock .t::after{content:"  🔒";font-size:13px}
.nav{display:flex;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:none;background:none;padding:12px 0 14px;color:var(--muted);font-size:15px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.month{margin-top:18px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mh span:first-child{font-family:var(--display);font-size:18px}
.mh span:last-child{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:transparent;padding:0}
.dot.read{background:var(--accent);border-color:var(--accent)}
.dot.open{border-color:var(--gold);border-width:2px}
.dot.now{background:var(--gold);border-color:var(--gold)}
.dot:disabled{cursor:default}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.set{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px;font-size:15px}
.set label,.set .lr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.set input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.set small{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:none;color:var(--muted);padding:4px 10px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.rbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.rbar button{border:none;background:none;color:var(--accent);font-size:16px;padding:4px 6px}
.reader{padding:24px 22px 48px;font-size:var(--read);line-height:1.85}
.reader .sym{margin:0 auto;display:block;width:72px;height:72px}
.reader .dayl{text-align:center;font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:.03em}
.reader h1{font-family:var(--display);font-weight:400;font-size:1.55em;line-height:1.3;text-align:center;margin:6px 0 24px;text-wrap:balance}
.reader h2{font-size:1em;font-weight:600;color:var(--accent);margin:34px 0 10px}
.reader h4{font-family:var(--display);font-weight:400;font-size:1.1em;margin:26px 0 6px}
.reader p{margin:0 0 1em}
.reader b{font-weight:600}
.hook{font-family:var(--display);font-size:1.1em;border-left:3px solid var(--gold);padding-left:14px}
.reader ul{padding-left:1.1em;margin:0}
.reader li{margin-bottom:.7em}
.box{background:var(--gold-soft);border-radius:14px;padding:16px 18px;margin-top:10px}
.box p:last-child{margin-bottom:0}
.quiz{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.quiz details{background:var(--accent-soft);border-radius:10px;padding:8px 14px}
.quiz summary{color:var(--accent);font-weight:500;cursor:pointer}
.quiz details p{margin:8px 0 4px}
.done-wrap{text-align:center;margin-top:34px}
.thanks{font-size:16px;color:var(--muted);margin-top:12px}
.ph{background:var(--soft);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.today,.reader{animation:in .35s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script>
const SYM={
waves:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 26c5-5 9-5 13 0s8 5 13 0 9-5 13 0 8 5 13 0"/><path d="M6 37c5-5 9-5 13 0s8 5 13 0 9-5 13 0 8 5 13 0"/><path d="M6 48c5-5 9-5 13 0s8 5 13 0 9-5 13 0 8 5 13 0"/><circle cx="46" cy="13" r="5"/></svg>',
scroll:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12h30a6 6 0 0 1 6 6v34H22a6 6 0 0 1-6-6z"/><path d="M16 12a6 6 0 0 0-6 6v4h6"/><path d="M24 24h20M24 32h20M24 40h12"/></svg>',
stars:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M32 10v12M32 42v12M10 32h12M42 32h12"/><path d="M18 18l6 6M40 40l6 6M46 18l-6 6M24 40l-6 6"/><circle cx="32" cy="32" r="3"/></svg>',
egg:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M32 8c11 0 18 18 18 30a18 18 0 0 1-36 0C14 26 21 8 32 8z"/><path d="M22 38c4-3 7 3 10 0s7 3 10 0" stroke-linecap="round"/></svg>',
lotus:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M32 14c6 7 6 21 0 30-6-9-6-23 0-30z"/><path d="M32 44c-4-9-12-15-20-15 1 9 8 15 20 15z"/><path d="M32 44c4-9 12-15 20-15-1 9-8 15-20 15z"/><path d="M14 50h36" stroke-linecap="round"/></svg>',
flame:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M26 56V24M38 56V24"/><path d="M32 6c5 6 8 10 8 14a8 8 0 0 1-16 0c0-4 3-8 8-14z"/><path d="M22 56h20"/></svg>',
spark:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M32 8l5 17 17 7-17 7-5 17-5-17-17-7 17-7z"/></svg>',
conch:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 40c0-14 10-26 24-26 8 0 12 6 12 12 0 10-10 20-24 22l-8 4z"/><path d="M26 30c4-4 10-4 12 0s-2 8-6 8"/><path d="M50 24l6-4"/></svg>',
bow:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8c16 8 16 40 0 48"/><path d="M20 8v48"/><path d="M12 32h40M46 27l6 5-6 5"/></svg>',
wheel:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="5"/><path d="M32 10v17M32 37v17M10 32h17M37 32h17M16.5 16.5l12 12M35.5 35.5l12 12M47.5 16.5l-12 12M28.5 35.5l-12 12"/></svg>',
feather:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 58V18"/><path d="M32 18c-12 2-18 14-14 28 6 2 12 0 14-4 2 4 8 6 14 4 4-14-2-26-14-28z"/><ellipse cx="32" cy="30" rx="5" ry="6"/></svg>',
trident:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8v50"/><path d="M18 14c0 12 6 16 14 16s14-4 14-16"/><path d="M32 8l-4 6h8z"/><path d="M26 44h12"/></svg>',
diya:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 38c4 10 12 14 22 14s18-4 22-14z"/><path d="M32 10c5 7 7 11 7 15a7 7 0 0 1-14 0c0-4 2-8 7-15z"/></svg>',
sun:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="32" cy="32" r="11"/><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M50.4 13.6l-5.7 5.7M19.3 44.7l-5.7 5.7"/></svg>',
moon:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M42 10a22 22 0 1 0 12 30A18 18 0 0 1 42 10z"/></svg>',
tree:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 58V30"/><path d="M32 30c-14 0-20-8-16-16 4-6 10-6 16-2 6-4 12-4 16 2 4 8-2 16-16 16z"/><path d="M32 44l-8-6M32 40l8-6M20 58h24"/></svg>',
mountain:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 52l18-30 10 16 6-8 18 22z"/><path d="M20 29l4 3 4-3"/></svg>'};
const D=window.KY_DAYS, MONTHS=window.KY_MONTHS, TOTAL=D.length;
const S={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let st=S.get("ky_state",null);
if(!st){st={start:ymd(new Date()),read:[],size:19,theme:"auto"};S.set("ky_state",st);}
let view="home",openDay=null;const cache={};
const save=()=>S.set("ky_state",st);
const $=id=>document.getElementById(id);
function todayN(){const [y,m,d]=st.start.split("-").map(Number);const s=new Date(y,m-1,d);const t=new Date();t.setHours(0,0,0,0);return Math.min(TOTAL,Math.max(1,Math.round((t-s)/864e5)+1));}
function info(n){const x=D[n-1];return {n,t:x[0],w:x[1],f:x[2],min:x[3],sym:x[4]}}
function applyPrefs(){document.documentElement.style.setProperty("--read",st.size+"px");if(st.theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",st.theme);}
function streak(T){let s=0;for(let d=T;d>=1;d--){if(st.read.includes(d))s++;else if(d!==T)break;}return s}
function greet(){const h=new Date().getHours();return h<12?"शुभ प्रभात 🌸":h<17?"नमस्ते 🌸":"शुभ संध्या 🪔"}
function home(){
  const T=todayN(),d=info(T),read=st.read.includes(T);
  const missed=[];for(let i=1;i<T;i++)if(!st.read.includes(i))missed.push(i);
  const dateStr=new Date().toLocaleDateString("hi-IN",{weekday:"long",day:"numeric",month:"long"});
  const next=T<TOTAL?info(T+1):null;
  return `<div class="screen">
   <div class="top"><span class="brand">कथा यात्रा</span><span class="date">${dateStr}</span></div>
   <p class="hello">${greet()}</p>
   <p class="sub">${MONTHS[Math.ceil(T/30)-1]} का सफ़र जारी है</p>
   <div class="prog"><span>Day ${T} / ${TOTAL}</span><span>${st.read.length} ${st.read.length===1?"कहानी पढ़ी":"कहानियाँ पढ़ीं"}</span></div>
   <div class="track"><i style="width:${Math.max(st.read.length/TOTAL*100,1)}%"></i></div>
   <div class="today"><div class="sym">${SYM[d.sym]}</div><div class="lbl">आज की कहानी · DAY ${d.n}</div>
     <h2 class="ttl">${d.t}</h2><div class="chips"><span class="chip">${d.f}</span><span class="chip">${d.min} मिनट</span></div><div class="chips">${d.w}</div>
     <button class="go${read?' done':''}" type="button" data-open="${d.n}">${read?'✓ पढ़ ली · फिर से पढ़ें':'पढ़ना शुरू करें'}</button></div>
   ${missed.length?`<div class="sect"><h3>छूटी हुई कहानियाँ (${missed.length})</h3>${missed.slice(-10).reverse().map(n=>{const x=info(n);return `<button class="row" type="button" data-open="${n}"><span class="s">${SYM[x.sym]}</span><span class="t">${x.t}</span><span class="n">Day ${n}</span></button>`}).join("")}${missed.length>10?`<p class="sub" style="font-size:13px">बाकी "सफ़र" टैब में</p>`:''}</div>`:''}
   ${next?`<div class="sect"><h3>कल क्या है?</h3><div class="row lock"><span class="s">${SYM[next.sym]}</span><span class="t">${next.t}</span><span class="n">Day ${next.n}</span></div><p class="sub" style="font-size:13px">कल सुबह खुलेगी</p></div>`:''}
  </div>`;
}
function journey(){
  const T=todayN();
  let h=`<div class="screen"><div class="top"><span class="brand">आपका सफ़र</span></div>
   <div class="stat"><div><b>${st.read.length}</b><span>पढ़ी गईं</span></div><div><b>${streak(T)}</b><span>दिन लगातार</span></div><div><b>${TOTAL-T}</b><span>दिन बाकी</span></div></div>`;
  MONTHS.forEach((m,mi)=>{const s=mi*30+1,rn=st.read.filter(x=>x>=s&&x<s+30).length;
    h+=`<div class="month"><div class="mh"><span>${mi+1}. ${m}</span><span>${rn}/30</span></div><div class="dots">`;
    for(let n=s;n<s+30&&n<=TOTAL;n++){const r=st.read.includes(n),o=n<=T,now=n===T&&!r;
      h+=`<button type="button" class="dot${r?' read':now?' now':o?' open':''}" ${o?`data-open="${n}"`:'disabled'} aria-label="Day ${n}"></button>`}
    h+=`</div></div>`;});
  h+=`<div class="key"><span><i style="background:var(--accent);border-color:var(--accent)"></i>पढ़ी</span><span><i style="background:var(--gold);border-color:var(--gold)"></i>आज</span><span><i style="border-color:var(--gold)"></i>छूटी</span><span><i></i>आने वाली</span></div>
   <div class="set">
    <label for="start">शुरुआत की तारीख <input type="date" id="start" value="${st.start}"></label>
    <small>Day 1 इसी तारीख को खुला था। इसे बदलने से "आज" का दिन बदल जाएगा।</small>
    <div class="lr">रंग <span class="seg">${[["auto","फ़ोन जैसा"],["light","दिन"],["dark","रात"]].map(([k,l])=>`<button type="button" data-th="${k}" aria-pressed="${st.theme===k}">${l}</button>`).join("")}</span></div>
   </div></div>`;
  return h;
}
function reader(n){
  const d=info(n),read=st.read.includes(n),T=todayN(),nx=n<TOTAL?info(n+1):null;
  const body=cache[n]===undefined?`<p class="ph">कहानी खुल रही है...</p>`:cache[n]===null?`<p class="ph">यह कहानी जल्द आ रही है 🌸<br>थोड़ी देर बाद फिर देखिए।</p>`:cache[n];
  return `<div class="rbar"><button type="button" data-back>← वापस</button><span><button type="button" data-size="-1" aria-label="Smaller text">अ−</button><button type="button" data-size="1" aria-label="Larger text">अ+</button></span></div>
  <article class="reader"><div class="sym">${SYM[d.sym]}</div><div class="dayl">${d.f} · DAY ${d.n} · ${d.min} मिनट</div><h1>${d.t}</h1>${body}
   ${cache[n]?`<div class="done-wrap">${read?`<p class="thanks">✓ यह कहानी पढ़ ली गई है</p>`:`<button class="go" type="button" data-done="${n}" style="width:100%">पढ़ ली ✓</button>`}${nx&&n>=T?`<p class="thanks">कल की कहानी: <b>${nx.t}</b></p>`:''}</div>`:''}</article>`;
}
function load(n){if(cache[n]!==undefined)return;
  fetch(`content/day-${String(n).padStart(3,"0")}.html`,{cache:"no-cache"}).then(r=>r.ok?r.text():null).catch(()=>null).then(t=>{cache[n]=t;if(view==="read"&&openDay===n)render();});}
function render(){applyPrefs();const a=$("app");
  if(view==="read"){a.innerHTML=reader(openDay);return}
  a.innerHTML=(view==="home"?home():journey())+`<nav class="nav"><button type="button" data-view="home" ${view==="home"?'aria-current="page"':''}>☀️ आज</button><button type="button" data-view="journey" ${view==="journey"?'aria-current="page"':''}>🗺️ सफ़र</button></nav>`;}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.open){openDay=+b.dataset.open;view="read";load(openDay);render();window.scrollTo(0,0);return}
  if(b.hasAttribute("data-back"))view="home";
  else if(b.dataset.done){const n=+b.dataset.done;if(!st.read.includes(n))st.read.push(n);}
  else if(b.dataset.size)st.size=Math.min(24,Math.max(16,st.size+ +b.dataset.size));
  else if(b.dataset.view)view=b.dataset.view;
  else if(b.dataset.th)st.theme=b.dataset.th;
  else return;
  save();render();if(view!=="read")window.scrollTo(0,0);});
document.addEventListener("change",e=>{if(e.target.id==="start"&&e.target.value){st.start=e.target.value;save();render();}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&view!=="read")render();});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>

</body>
</html>
