<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6a">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>कथा यात्रा</title>

<style>
/* Layout: one phone-width column. Two tabs (Today, Journey) and a full-screen reader. */
:root{
  --bg:#fdfcff; --soft:#f4f3f9; --ink:#24213a; --muted:#6a6782; --line:#e4e1ef;
  --accent:#0f6e6a; --accent-soft:#e0f1ef; --gold:#b9770e; --gold-soft:#fbefd9;
  --display:"Eczar","Noto Serif Devanagari",Georgia,serif;
  --body:"Hind","Noto Sans Devanagari",system-ui,sans-serif;
  --read:19px;
  --pat:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20stroke%3D%22%230f6e6a%22%20stroke-width%3D%221.6%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.09%22%3E%3Cg%20transform%3D%22translate%2816%2016%29%20scale%28.5%29%22%3E%3Cpath%20d%3D%22M32%2014c6%207%206%2021%200%2030-6-9-6-23%200-30z%22/%3E%3Cpath%20d%3D%22M32%2044c-4-9-12-15-20-15%201%209%208%2015%2020%2015z%22/%3E%3Cpath%20d%3D%22M32%2044c4-9%2012-15%2020-15-1%209-8%2015-20%2015z%22/%3E%3C/g%3E%3C/svg%3E");
}
:root[data-theme="dark"]{--pat:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20stroke%3D%22%239c98e6%22%20stroke-width%3D%221.6%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.16%22%3E%3Cg%20transform%3D%22translate%2816%2016%29%20scale%28.5%29%22%3E%3Cpath%20d%3D%22M32%2014c6%207%206%2021%200%2030-6-9-6-23%200-30z%22/%3E%3Cpath%20d%3D%22M32%2044c-4-9-12-15-20-15%201%209%208%2015%2020%2015z%22/%3E%3Cpath%20d%3D%22M32%2044c4-9%2012-15%2020-15-1%209-8%2015-20%2015z%22/%3E%3C/g%3E%3C/svg%3E"); --bg:#151633; --soft:#1d1e48; --ink:#e9e6ff; --muted:#a9a6d6; --line:#2e2f60; --accent:#f2c95c; --accent-soft:#23245a; --gold:#f2c95c; --gold-soft:#262862; color-scheme:dark}
:root[data-theme="dark"] .go{border-radius:999px;color:#1a1b3d}
:root[data-theme="dark"] .go.done{color:var(--accent);background:transparent}
:root[data-theme="dark"] .dot.now{background:#fff;border-color:#fff;color:#1a1b3d}
:root[data-theme="dark"] .dot.read{color:#1a1b3d}
.key i.k-read{background:var(--accent);border-color:var(--accent)}.key i.k-now{background:var(--gold);border-color:var(--gold)}.key i.k-open{border-color:var(--gold)}
:root[data-theme="dark"] .key i.k-now{background:#fff;border-color:#fff}
:root[data-theme="dark"] .today{border:1px solid var(--line)}
:root[data-theme="dark"] .reader h1,:root[data-theme="dark"] .ttl,:root[data-theme="dark"] .hello{color:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;padding:22px 20px 24px}
.app.pat{background-image:var(--pat);background-size:64px 64px;background-repeat:repeat}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:20px;color:var(--accent)}
.date{font-size:13px;color:var(--muted)}
.hello{font-family:var(--display);font-weight:500;font-size:28px;margin:18px 0 2px;line-height:1.25}
.sub{color:var(--muted);margin:0}
.prog{margin:18px 0 6px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.today{margin-top:22px;background:var(--accent-soft);border-radius:18px;padding:22px 20px;display:grid;gap:10px}
.sym{width:64px;height:64px;color:var(--accent)}
.sym svg,.s svg{width:100%;height:100%;display:block}
.lbl{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.ttl{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.3;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.chip{background:var(--bg);border-radius:6px;padding:1px 8px}
.go{border:none;background:var(--accent);color:var(--bg);border-radius:12px;padding:12px;font-size:17px;font-weight:500;margin-top:4px}
.go.done{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.sect{margin-top:22px}
.sect h3{font-size:15px;font-weight:600;margin:0 0 8px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);text-align:left}
.row .n{font-size:12px;color:var(--muted);width:50px;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.row .t{font-family:var(--display);font-size:17px;flex:1;min-width:0}
.row .s{width:28px;height:28px;color:var(--gold);flex:0 0 auto}
.lock{opacity:.75}
.lock .t::after{content:"  🔒";font-size:13px}
.nav{display:flex;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:none;background:none;padding:12px 0 14px;color:var(--muted);font-size:15px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.month{margin-top:18px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mh span:first-child{font-family:var(--display);font-size:18px}
.mh span:last-child{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);padding:0;display:grid;place-items:center;font-size:12px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.dot.n3{font-size:10.5px;letter-spacing:-.02em}
.dot.read{background:var(--accent);border-color:var(--accent);color:#fff}
.dot.open{border-color:var(--gold);border-width:2px;color:var(--ink)}
.dot.now{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.dot[data-lock]{cursor:default}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line);background:var(--bg)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.set{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px;font-size:15px}
.set label,.set .lr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.set input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.set small{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:none;color:var(--muted);padding:4px 10px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.rbar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.rbar button{border:none;background:none;color:var(--accent);font-size:17px;padding:8px 10px;min-height:42px;min-width:42px}
.rbar.three{display:grid;grid-template-columns:1fr auto 1fr}
.rbar.three>:first-child{justify-self:start}.rbar.three>.fs{justify-self:center;display:flex}.rbar.three>.nx{justify-self:end}
.rbar button.dim{color:var(--muted)}
.rprog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--gold);width:0;border-radius:0 2px 2px 0;transition:width .15s linear}
.reader{padding:24px 22px 48px;font-size:var(--read);line-height:1.85}
.reader .sym{margin:0 auto;display:block;width:72px;height:72px}
.reader .dayl{text-align:center;font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:.03em}
.reader h1{font-family:var(--display);font-weight:600;font-size:1.55em;line-height:1.3;text-align:center;margin:6px 0 24px;text-wrap:balance}
.reader h2{font-size:1em;font-weight:600;color:var(--accent);margin:34px 0 10px}
.reader h4{font-family:var(--display);font-weight:500;font-size:1.1em;margin:26px 0 6px}
.reader p{margin:0 0 1em}
.reader b{font-weight:600}
.hook{font-family:var(--body);font-size:1.08em;border-left:3px solid var(--gold);padding-left:14px}
.reader ul{padding-left:1.1em;margin:0}
.reader li{margin-bottom:.7em}
.box{background:var(--gold-soft);border-radius:14px;padding:16px 18px;margin-top:10px}
.box p:last-child{margin-bottom:0}
.quiz{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.quiz details{background:var(--accent-soft);border-radius:10px;padding:8px 14px}
.quiz summary{color:var(--accent);font-weight:500;cursor:pointer}
.quiz details p{margin:8px 0 4px}
.done-wrap{text-align:center;margin-top:34px}
.thanks{font-size:16px;color:var(--muted);margin-top:12px}
.notif{display:grid;gap:8px;background:var(--soft);border-radius:12px;padding:12px}
.notif .nb{border:none;background:var(--accent);color:var(--bg);border-radius:10px;padding:9px 12px;font-size:15px}
.notif .nb.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.notif textarea{width:100%;min-height:70px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
.notif .btns{display:flex;gap:8px;flex-wrap:wrap}
.notif a.nb{text-decoration:none;text-align:center}
.nav{view-transition-name:nav}
::view-transition-group(nav){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.75,.25,1);animation-fill-mode:both}
@keyframes ky-fi{from{opacity:0}}@keyframes ky-fo{to{opacity:0}}
@keyframes ky-in-r{from{transform:translateX(30%);opacity:0}}@keyframes ky-out-l{to{transform:translateX(-18%);opacity:0}}
@keyframes ky-in-l{from{transform:translateX(-30%);opacity:0}}@keyframes ky-out-r{to{transform:translateX(18%);opacity:0}}
@keyframes ky-in-up{from{transform:translateY(14%);opacity:0}}@keyframes ky-out-dn{to{transform:translateY(10%);opacity:0}}
@keyframes ky-zin{from{transform:scale(.93);opacity:0}}@keyframes ky-zout{to{transform:scale(1.04);opacity:0}}
html[data-anim=fade]::view-transition-old(root){animation-name:ky-fo;animation-duration:.18s}
html[data-anim=fade]::view-transition-new(root){animation-name:ky-fi}
html[data-anim=slide][data-dir=left]::view-transition-old(root){animation-name:ky-out-l}
html[data-anim=slide][data-dir=left]::view-transition-new(root){animation-name:ky-in-r}
html[data-anim=slide][data-dir=right]::view-transition-old(root){animation-name:ky-out-r}
html[data-anim=slide][data-dir=right]::view-transition-new(root){animation-name:ky-in-l}
html[data-anim=slide][data-dir=up]::view-transition-old(root){animation-name:ky-fo;animation-duration:.2s}
html[data-anim=slide][data-dir=up]::view-transition-new(root){animation-name:ky-in-up}
html[data-anim=slide][data-dir=down]::view-transition-old(root){animation-name:ky-out-dn}
html[data-anim=slide][data-dir=down]::view-transition-new(root){animation-name:ky-fi}
html[data-anim=lift]::view-transition-old(root){animation-name:ky-fo;animation-duration:.2s}
html[data-anim=lift]::view-transition-new(root){animation-name:ky-zin}
html[data-anim=lift][data-dir=down]::view-transition-old(root),html[data-anim=lift][data-dir=right]::view-transition-old(root){animation-name:ky-zout}
html[data-anim=lift][data-dir=down]::view-transition-new(root),html[data-anim=lift][data-dir=right]::view-transition-new(root){animation-name:ky-fi}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;white-space:nowrap;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.aboutlink{display:block;width:100%;margin-top:18px;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:12px;padding:12px;font-size:16px;font-weight:500}
.about{padding:8px 20px 40px}
.about .hero{text-align:center;padding:12px 0 6px}
.about .hero .sym{margin:0 auto;width:68px;height:68px}
.about h1{font-family:var(--display);font-weight:600;font-size:30px;margin:6px 0 0}
.about .tag{color:var(--muted);margin:2px 0 0}
.about h3{font-family:var(--display);font-weight:500;font-size:19px;margin:26px 0 8px}
.about p,.about li{line-height:1.8}
.about ul{padding-left:1.1em;margin:0}.about li{margin-bottom:.4em}
.about .sign{text-align:right;font-family:var(--display);font-weight:500;margin:10px 0 0}
.about .dev{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:14px}
.about .dev .av{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:600;flex:0 0 auto}
.about .dev b{display:block;font-size:17px}.about .dev small{color:var(--muted)}
.about .meta{display:grid;gap:8px;font-size:14px;color:var(--muted);margin-top:8px}
.about .meta div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px}
.about .meta span:last-child{color:var(--ink);text-align:right}
.about .contact{display:grid;gap:8px;margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.about .contact span{font-size:14px;color:var(--muted)}
.about .contact b{font-size:18px;font-weight:600;user-select:all;font-variant-numeric:tabular-nums}
.about .cbtns{display:flex;gap:8px}
.about .cbtns .nb{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:9px 12px;font-size:15px;background:var(--accent);color:var(--bg);border:1px solid var(--accent)}
.about .cbtns .nb.ghost{background:transparent;color:var(--accent)}
:root[data-theme="dark"] .about .cbtns .nb:not(.ghost){color:#1a1b3d}
.about .credit{font-size:14px;color:var(--muted);margin:14px 0 0;line-height:1.7}
.ph{background:var(--soft);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.today,.reader{animation:in .35s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

  if(b.dataset.open){const n=+b.dataset.open;load(n).then(()=>navTo("read",n));return}
  if(b.dataset.next){const n=+b.dataset.next;load(n).then(()=>navTo("read",n,"left"));if(n<TOTAL)load(n+1);return}
  if(b.dataset.lock){const n=+b.dataset.lock,d=n-todayN();toast(d===1?"🔒 यह कहानी कल सुबह खुलेगी":`🔒 Day ${n}, ${d} दिन बाद खुलेगी`,0);return}
  if(b.hasAttribute("data-back")){navTo("home");return}
  if(b.dataset.view){const v=b.dataset.view;if(v!==view)navTo(v,undefined,b.dataset.dir);return}
  else if(b.dataset.size)st.size=Math.min(24,Math.max(16,st.size+ +b.dataset.size));
  else if(b.dataset.th)st.theme=b.dataset.th;
  else return;
  const y=window.scrollY,nav=!!(b.dataset.view||b.hasAttribute("data-back"));save();render();window.scrollTo(0,nav?0:y);});
document.addEventListener("change",e=>{if(e.target.id==="start"&&e.target.value){st.start=e.target.value;save();notifRefresh().then(render);}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(view!=="read"){render();prefetch()}else keepAwake(true);});
applyPrefs();render();
setInterval(()=>{applyPrefs();if(view!=="read"&&todayN()!==lastT){render();prefetch()}},60000);
setTimeout(prefetch,1500);
notifRefresh();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>
